[project]
name = "harbor-pi-code-mode-runtime"
version = "0.1.0rc1"
description = "Pinned Pi Code Mode ACP runtime for Harbor"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["agent-client-protocol==0.12.1"]

[project.scripts]
harbor-pi-code-mode = "harbor_pi_code_mode.agent:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_pi_code_mode"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

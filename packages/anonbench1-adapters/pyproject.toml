[project]
name = "harbor-anonbench1-adapters"
version = "0.1.0rc12"
description = "Pinned native Harbor adapters for the Anonbench1 Pi, Hermes, Codex, and Claude Code runs"
requires-python = ">=3.12"
license = "MIT"
# Runtime dependency note: harbor comes from the parent worker image, which pins
# harbor-framework/harbor@11a0fe2d (the launch contract). The wheel declares no
# dependencies so installing it can never move the Harbor revision the launch
# contract checks. The dev group pins the same upstream commit for the tests.
dependencies = []

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anonbench1_adapters"]

[dependency-groups]
dev = [
    "harbor @ git+https://github.com/harbor-framework/harbor.git@11a0fe2d3305e144a5e8af625d50a7394f293f75",
    "agent-client-protocol==0.12.1",
    "litellm==1.104.1",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "ty==0.0.59",
    "hatchling==1.32.0",
]

[tool.ty.rules]
all = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-unresolved-reference = "error"
possibly-missing-import = "error"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.analysis]
respect-type-ignore-comments = false

[tool.ty.src]
# The synced adapter modules are generated copies (see the ruff exclude note).
exclude = [
  "src/anonbench1_adapters/anonbench1_hermes.py",
  "src/anonbench1_adapters/hermes_source.py",
  "src/anonbench1_adapters/offline_hermes_transport.py",
  "src/anonbench1_adapters/offline_hermes_state.py",
  "src/anonbench1_adapters/offline_hermes_task.py",
  "src/anonbench1_adapters/offline_hermes_web.py",
  "src/anonbench1_adapters/offline_hermes_host.py",
  "src/anonbench1_adapters/offline_hermes_native.py",
  "src/anonbench1_adapters/hermes_harbor/*",
  "src/anonbench1_adapters/anonbench1_pi.py",
  "src/anonbench1_adapters/anonbench1_pins.py",
  "src/anonbench1_adapters/offline_pi.py",
  "src/anonbench1_adapters/resource_telemetry.py",
  "src/anonbench1_adapters/standalone_observations.py",
  "src/anonbench1_adapters/observed_codex.py",
  "src/anonbench1_adapters/retained_codex.py",
  "src/anonbench1_adapters/retained_codex_probe.py",
  "src/anonbench1_adapters/observed_claude_code.py",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov-config=packages/anonbench1-adapters/pyproject.toml --cov=anonbench1_adapters --cov-branch --cov-fail-under=85"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["anonbench1_adapters"]
# Generated source has separate provenance and upstream protocol checks.
omit = [
  "*/anonbench1_adapters/anonbench1_hermes.py",
  "*/anonbench1_adapters/hermes_source.py",
  "*/anonbench1_adapters/offline_hermes_transport.py",
  "*/anonbench1_adapters/offline_hermes_state.py",
  "*/anonbench1_adapters/offline_hermes_task.py",
  "*/anonbench1_adapters/offline_hermes_web.py",
  "*/anonbench1_adapters/offline_hermes_host.py",
  "*/anonbench1_adapters/offline_hermes_native.py",
  "*/anonbench1_adapters/hermes_harbor/*",
  "*/anonbench1_adapters/anonbench1_pi.py",
  "*/anonbench1_adapters/anonbench1_pins.py",
  "*/anonbench1_adapters/offline_pi.py",
  "*/anonbench1_adapters/resource_telemetry.py",
  "*/anonbench1_adapters/standalone_observations.py",
  "*/anonbench1_adapters/observed_codex.py",
  "*/anonbench1_adapters/retained_codex.py",
  "*/anonbench1_adapters/retained_codex_probe.py",
  "*/anonbench1_adapters/observed_claude_code.py",
]

[tool.ruff]
line-length = 88
target-version = "py312"
# The copied adapter modules are verbatim copies of the harbor-config source
# (restored by scripts/sync_anonbench1_adapters.py), except for the recorded
# renames. Formatting them would break the sync, so they stay outside ruff.
extend-exclude = [
  "src/anonbench1_adapters/anonbench1_hermes.py",
  "src/anonbench1_adapters/hermes_source.py",
  "src/anonbench1_adapters/offline_hermes_transport.py",
  "src/anonbench1_adapters/offline_hermes_state.py",
  "src/anonbench1_adapters/offline_hermes_task.py",
  "src/anonbench1_adapters/offline_hermes_web.py",
  "src/anonbench1_adapters/offline_hermes_host.py",
  "src/anonbench1_adapters/offline_hermes_native.py",
  "src/anonbench1_adapters/hermes_harbor/*",
  "src/anonbench1_adapters/anonbench1_hermes.py",
  "src/anonbench1_adapters/hermes_source.py",
  "src/anonbench1_adapters/offline_hermes_transport.py",
  "src/anonbench1_adapters/offline_hermes_state.py",
  "src/anonbench1_adapters/offline_hermes_task.py",
  "src/anonbench1_adapters/offline_hermes_web.py",
  "src/anonbench1_adapters/offline_hermes_host.py",
  "src/anonbench1_adapters/offline_hermes_native.py",
  "src/anonbench1_adapters/hermes_harbor/*",
  "src/anonbench1_adapters/anonbench1_pi.py",
  "src/anonbench1_adapters/anonbench1_pins.py",
  "src/anonbench1_adapters/offline_pi.py",
  "src/anonbench1_adapters/resource_telemetry.py",
  "src/anonbench1_adapters/standalone_observations.py",
  "src/anonbench1_adapters/observed_codex.py",
  "src/anonbench1_adapters/retained_codex.py",
  "src/anonbench1_adapters/retained_codex_probe.py",
  "src/anonbench1_adapters/observed_claude_code.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

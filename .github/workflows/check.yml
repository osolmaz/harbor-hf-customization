name: check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 0.12.5
          python-version: '3.12'
      - run: uv sync --all-groups --locked
      - run: uv lock --check --project harnesses/pi-code-mode
      - run: sh -n tests/canary/code-mode/tests/test.sh
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest --cov=harbor_pi_code_mode --cov-fail-under=85
      - name: Check the public Pi catalog contract without inference
        run: |
          uv run python - <<'PY'
          from harbor_pi_code_mode.models import CATALOG, fetch_json
          from harbor_pi_code_mode.values import record
          catalog = record(fetch_json(CATALOG))
          assert catalog
          assert all(key == record(model).get("id") for key, model in catalog.items())
          PY
      - run: uv run lint-imports
      - run: uv run pip-audit
      - run: uv run slophammer-py check .
      - run: uv run slophammer-py dry .
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      - run: npm ci --ignore-scripts
        working-directory: build/pi-code-mode
      - run: npm audit --audit-level=low
        working-directory: build/pi-code-mode
      - run: build/pi-code-mode/node_modules/.bin/biome check src/harbor_pi_code_mode/request-limit.mjs tests/request-limit.test.mjs
      - run: build/pi-code-mode/node_modules/.bin/tsc --allowJs --checkJs --noEmit --strict --module nodenext --target es2023 --types node --typeRoots build/pi-code-mode/node_modules/@types src/harbor_pi_code_mode/request-limit.mjs
      - run: node --test tests/request-limit.test.mjs
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/pi-code-mode/Dockerfile
          platforms: linux/amd64
          outputs: type=local,dest=dist
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: pi-code-mode-runtime
          path: dist/*.whl
          if-no-files-found: error
